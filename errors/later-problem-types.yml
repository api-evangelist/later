gaps:
- No `type` key enum is published, so the SCREAMING_SNAKE_CASE values in the legacy
  envelope cannot be enumerated from the contract — RESOURCE_FORBIDDEN_ERROR and
  SERVER_ERROR are recorded here only because they were observed live.
- No public error-reference documentation page exists on later.com to enrich these.
- The two envelopes coexist on the same host with no discriminator; a client must be
  prepared for both `{type,error}` and `{message,details}`.
