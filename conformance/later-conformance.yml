standards:
- id: openapi-3
  name: OpenAPI 3.x
  conforms: false
  evidence: >-
    The published contract at https://api.mavrck.co/api-docs declares `swagger: "2.0"`.
    It is a real, complete, 687-operation machine-readable contract, but it predates
    OpenAPI 3 and uses host/basePath/definitions/securityDefinitions rather than
    servers/components/securitySchemes.
- id: swagger-2
  name: Swagger / OpenAPI 2.0
  conforms: true
  evidence: >-
    openapi/later-influence-api-openapi.json declares `swagger: "2.0"` with 548 paths,
    687 operations and 1071 definitions.
- id: asyncapi
  name: AsyncAPI
  conforms: false
  evidence: >-
    /asyncapi.yaml and /asyncapi.json return 404 on later.com and api.mavrck.co (301 on
    app.later.com). See asyncapi/later-influence-webhooks.yml.
- id: rfc9457
  name: RFC 9457 Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    No operation declares application/problem+json; the contract's only produced media
    type is application/json and it carries two competing vendor error envelopes. See
    errors/later-problem-types.yml.
- id: oauth2
  name: OAuth 2.0
  conforms: false
  evidence: >-
    `securityDefinitions` declares a single apiKey header scheme. No authorization or
    token endpoint is published; /.well-known/oauth-authorization-server 404s on every
    host. (The /oauth/tiktok and /auth/facebook operations are OAuth against the SOCIAL
    NETWORKS, not against Later.)
- id: oidc
  name: OpenID Connect
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 (later.com, api.mavrck.co) and
    301 (app.later.com).
- id: idempotency
  name: Idempotent request keys (draft-ietf-httpapi-idempotency-key-header)
  conforms: false
  evidence: >-
    Zero occurrences of any idempotency header or parameter across all 687 operations.
    No `type: Idempotency` pointer is emitted. See conventions/later-conventions.yml.
- id: rfc8594
  name: RFC 8594 Sunset header / deprecation signalling
  conforms: false
  evidence: >-
    No Sunset or Deprecation response header is declared anywhere in the contract; in
    fact NO response headers at all are declared. One operation carries
    `deprecated: true` while 57 definitions are named *Deprecated. See
    lifecycle/later-lifecycle.yml.
- id: rfc9116
  name: RFC 9116 security.txt
  conforms: partial
  evidence: >-
    Served at https://app.later.com/.well-known/security.txt (HTTP 200) with Contact and
    Expires, but the Expires date is 2024-06-12 — expired — and there is no Policy field.
    Under RFC 9116 section 2.5.5 the file MUST NOT be used while expired.
- id: rate-limit-headers
  name: RateLimit header fields (draft-ietf-httpapi-ratelimit-headers)
  conforms: false
  evidence: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header appears in the contract, and none
    was returned on live unauthenticated responses from api.mavrck.co on 2026-08-13.
- id: pagination
  name: Consistent collection pagination
  conforms: partial
  evidence: >-
    limit/offset query parameters are used consistently (56 and 53 operations), but only
    ONE paginated response envelope carrying meta.totalCount is declared, so most list
    operations return a bare array with no total.
- id: json-api
  name: 'JSON:API'
  conforms: false
  evidence: No application/vnd.api+json media type and no JSON:API document structure in
