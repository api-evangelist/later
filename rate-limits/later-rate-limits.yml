api_limits:
  api: Later Influence API
  base_url: https://api.mavrck.co/v1
  documented_request_rate_limits: none
  response_headers:
    x_ratelimit: not present
    ratelimit: not present
    retry_after: not present
    evidence: >-
      Zero occurrences of X-RateLimit-*, RateLimit-* or Retry-After across all 687
      operations and 1,071 definitions of the published contract, and none observed on
      live unauthenticated responses from api.mavrck.co on 2026-08-13. In fact the
      contract declares NO response headers at all on any operation.
  declared_429:
  - operation: exportContent
    method: POST
    path: /v1/export/content
    message: Priority export slot is busy
    kind: concurrency limit, not a request-rate limit
    note: >-
      This is the ONLY 429 declared anywhere in the contract. It signals that a priority
      export slot is occupied, so exports must be serialized; it says nothing about how
      many requests per second the API will accept.
  finding: >-
    An agent or client integrating the Later Influence API has NO runtime backpressure
    signal. There is no published limit to plan against and no header to read, so the only
    strategy available is to back off on 500 — which is declared on 685 of 687 operations
    and is therefore useless as a discriminator.
notes:
  - Later publishes no formal public REST API for the Later Social scheduling product.
  - The Later Influence (formerly Mavrck) API has a complete public contract but publishes
    no rate limits.
  - Plan quotas below are product usage caps, not API rate limits.
  - Underlying social platform rate limits (Instagram, TikTok, etc.) are managed by Later
    internally.
