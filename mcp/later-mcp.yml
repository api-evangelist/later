name: Later Influence (candidate MCP server)
description: >-
  A CANDIDATE tool surface derived from Later's own published contract. Later ships no MCP
  server of any kind — no hosted endpoint and no installable package — so nothing here is
  callable by an agent today.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: derived
search_evidence:
  note: >-
    Probed on 2026-08-13. No MCP server exists on any Later or Mavrck host, and no MCP
    package is published to npm or PyPI.
  probes:
  - url: https://later.com/mcp
    http_status: 404
  - url: https://app.later.com/mcp
    http_status: 404
  - url: https://api.mavrck.co/mcp
    http_status: 404
  - url: https://api.mavrck.co/v1/mcp
    http_status: 404
  - url: https://mcp.later.com/
    http_status: 000
    note: does not resolve in DNS
  - url: https://mcp.mavrck.co/
    http_status: 200
    note: >-
      SOFT 404 — REJECTED. mavrck.co has wildcard DNS and the origin answers HTTP 200 with
      the 13-byte body "404 Not Found" for every unknown subdomain (verified identical on
      zzztest.mavrck.co). A POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"} returns
      the same "404 Not Found" body under a 200. This is NOT an MCP endpoint and is
      recorded so a later pass does not credit it as one.
  registries:
  - registry: npm
    query: '@latermedia/mcp, later-sdk, mavrck-api'
    result: 404
  - registry: pypi
    query: later-api, mavrck, later-sdk
    result: 404
candidate_tools:
