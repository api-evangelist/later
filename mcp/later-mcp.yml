authentication_note: >-
  A real server would send the `api-key` request header on the brand/admin surface, and a
  bearer JWT on the /v1/later-influencers/* surface. See
  authentication/later-authentication.yml. No OAuth exists, so no MCP OAuth challenge
  metadata could be fetched.
caveats:
- 'DESTRUCTIVE OPERATIONS: fulfill_reward_win, send_bulk_campaign_message and
  approve/reject_activation move real money and send real messages to creators. The API
  publishes no idempotency key (see conventions/later-conventions.yml), so a retried tool
  call is a duplicate payment or a duplicate blast.'
- The contract carries no operation-level rate limits and no rate-limit response headers,
  so a server would have no backpressure signal to expose.
