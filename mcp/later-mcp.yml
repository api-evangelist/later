  - name: generate_brand_suitability_report
    description: Generate a fresh brand-suitability report for a creator.
    rest: [generateBrandSuitabilityReport, makeBrandSafetyRequest]
    method: POST
    path: /v1/global-users/{globalUserId}/brand-suitability
  - name: list_activations
    description: List creator activations.
    rest: [getActivations, getActionGroupActivations]
    method: GET
    path: /activations
  - name: approve_activation
    description: Approve a submitted activation.
    rest: [approveApprovalStatus]
    method: PUT
    path: /v1/activations/{activationId}/approveApprovalStatus
  - name: reject_activation
    description: Reject a submitted activation.
    rest: [rejectApprovalStatus]
    method: PUT
    path: /v1/activations/{activationId}/rejectApprovalStatus
  - name: review_draft_content
    description: Set the status of, and leave feedback on, submitted draft content.
    rest: [updateDraftContentStatus, updateDraftContentFeedback]
    method: PUT
    path: /v1/draft-content/{draftContentId}/status
  - name: review_concept_content
    description: Set the status of, and leave feedback on, a submitted creative concept.
    rest: [updateConceptContentStatus, updateConceptContentFeedback]
    method: PUT
    path: /v1/concept-content/{conceptContentId}/status
  - name: list_conversations
    description: List brand-to-creator conversations.
    rest: [getConversations, findAllConversations, countConversations]
