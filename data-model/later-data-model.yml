api: Later Influence API
note: >-
  Entity-relationship graph derived from the 548 paths, 687 operations and 1,071
  definitions of the Later Influence (formerly Mavrck) contract at
  https://api.mavrck.co/api-docs. Relationships are read from path nesting and from
  id-reference fields on the definitions; nothing is inferred from outside the contract.
  Later publishes no object reference page, so there are no documented id prefixes or
  id formats to record — the contract types most ids as `number`/`string` with no format.
vocabulary_note: >-
  The contract renames itself mid-flight and a client must know both words. An
  "action group" IS a campaign — the brand-facing surface calls it /action-groups and the
  influencer-facing surface calls the same thing /v1/later-influencers/{id}/campaigns.
  Likewise the contract states in its own descriptions that "brand" and "program" are
  equivalent: Later Social says brand, Later Influence says program.
entities:
- name: Community
  aka: [instance, program, brand]
  description: The top-level tenant. Nearly every other entity is scoped to a communityId.
  operations: [getCommunities, createCommunity, getCommunity]
  id_field: communityId
  id_field_occurrences: 75
- name: ActionGroup
  aka: [Campaign]
  description: A campaign — the unit of influencer work, with candidates, statuses,
    conversations, submissions, activations and budget.
  id_field: actionGroupId
  id_field_occurrences: 46
- name: Action
  description: An individual task inside an action group, with a tracking link and
    activations.
  id_field: actionId
- name: GlobalUser
  description: The person record spanning communities — the identity an influencer is
    matched on.
  id_field: globalUserId
  id_field_occurrences: 63
- name: Influencer
  description: A community-scoped influencer profile, with points history, reward wins
    and memberships.
  id_field: influencerId
- name: LaterInfluencer
  description: The influencer-facing self-service surface (45 operations), addressed by
    influencerIdOrCreatorId, authenticated with a JWT rather than the api-key header.
  id_field: influencerIdOrCreatorId
- name: Membership
  description: An influencer's membership in a community, carrying contact info and points.
  id_field: membershipId
