  id_field: listMemberId
- name: Activation
  description: A recorded activation of an action by an influencer.
  id_field: activationId
- name: Incentive
  description: An offer with claims and winners; winners can be disqualified/requalified.
  id_field: incentiveId
- name: RewardWin
  description: A won reward, the bridge between an incentive and a payment.
  id_field: rewardWinId
- name: Concept
  description: A creative concept an influencer submits against a campaign.
  id_field: conceptId
- name: Draft
  description: Draft content submitted for approval against a campaign.
  id_field: draftContentId
- name: Conversation
  description: Threaded messaging between brand and candidate, with templates and
    scheduled messages.
  id_fields: [threadId, messageId]
- name: PaymentAccount
  description: The paying account; branches into StripePayments, CashPayments, gift cards
    and Tipalti payouts.
  id_field: cashPaymentAppId
- name: PaymentRecipient
  description: The influencer-side payee record, onboarded through Stripe Connect links.
- name: Budget
  description: Campaign budget with reference ids and balance transfer events.
  id_field: budgetReferenceId
- name: BrandSuitability
  description: Brand-safety scoring of a creator, with its own Harness sub-API (16 + 17
    operations).
- name: ShopifyAccount
  description: Connected Shopify store, with discount codes, products, reviews and the
    mandated GDPR compliance webhook receivers.
- name: Analytics
  aka: [CampaignPerformance, CustomAnalytics, Datapoints]
  description: Reporting surface over campaigns, communities and creators.
